name: Other
description: Dúvidas, ajuda de instalação, documentação ou outro assunto
title: "[Other]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use este formulário para assuntos que não se encaixam como problema ou sugestão.

        Se isto for sobre um problema ou funcionalidade ausente, consulte o [changelog não lançado](https://github.com/LoopLess-nardoto/nardoto-editor-open/blob/main/CHANGELOG.md); ele pode já ter sido corrigido ou adicionado à `main`.

  - type: dropdown
    id: topic
    attributes:
      label: What is this about?
      options:
        - Question / how do I…
        - Packaging / install help
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Tell us more
      description: What do you need, and any context that might help (OS, install method, screenshots, etc.).
      placeholder: Write your question or note here…
    validations:
      required: true
