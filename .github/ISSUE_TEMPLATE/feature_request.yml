name: Feature request
description: Sugira uma melhoria ou capacidade nova para o Nardoto Editor
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por compartilhar uma ideia para o Nardoto Editor. Escolha uma categoria e descreva o que gostaria.

        **Antes de abrir:** consulte o [changelog não lançado](https://github.com/LoopLess-nardoto/nardoto-editor-open/blob/main/CHANGELOG.md); a funcionalidade pode já estar em andamento ou ter chegado à `main`.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New video effect
        - New audio effect
        - New transition
        - UI / workflow improvement
        - Export / performance
        - Something else
    validations:
      required: true

  - type: textarea
    id: wish
    attributes:
      label: I wish Drift could…
      description: Describe the feature as if you're telling a friend what you want.
      placeholder: e.g. …add a beat-synced zoom that follows the music automatically
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would this help?
      description: Optional — when would you use it, or what problem does it solve?
      placeholder: e.g. I edit short-form videos and spend a lot of time keyframing zooms by hand.
    validations:
      required: false

  - type: textarea
    id: extras
    attributes:
      label: Extra details (optional)
      description: Examples, links, mockups, or similar tools that do this well. Attach images if useful.
    validations:
      required: false
