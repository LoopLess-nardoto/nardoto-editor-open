name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches CMakeLists.txt version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(grep -oP '^project\(Drift VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          if [ "${tag_version}" != "${cmake_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match CMakeLists.txt's project version (${cmake_version})"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Check the Arch package version matches too
        shell: bash
        run: |
          pkgver="$(grep -oP '^pkgver=\K.*' packaging/arch/PKGBUILD)"
          if [ "${pkgver}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::packaging/arch/PKGBUILD pkgver=${pkgver} does not match ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check Flatpak release notes exist for this version
        run: python3 scripts/extract_release_notes.py "${{ steps.version.outputs.version }}" release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  package:
    name: Package
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      android_identity: release
    secrets: inherit

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, package]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release notes
        run: |
          cp dist/release-notes/release-notes.md notes.md
          cat >> notes.md <<'EOF'

          ## Installing

          - **AppImage** (Linux, any distro): `chmod +x NardotoEditor-*.AppImage && ./NardotoEditor-*.AppImage`
          - **Windows installer**: run `NardotoEditor-Setup-*.exe`
          - **Windows portable**: extract `NardotoEditor-Portable-*.zip` e execute `nardoto-editor.exe`.
          - **macOS** (Apple Silicon): abra `NardotoEditor-*-arm64.dmg` e arraste Nardoto Editor para Aplicativos. O
            app is signed ad-hoc rather than notarised, so the first launch needs right-click →
            Open, or `xattr -dr com.apple.quarantine "/Applications/Nardoto Editor.app"`.
          - **Arch Linux**: `sudo pacman -U nardoto-editor-*.pkg.tar.zst`
          - **Flatpak**: requer `flatpak`; instale com `flatpak install --user NardotoEditor-*.flatpak`.
          - **Android**: instale o APK da sua arquitetura.

          Fonts, stickers, speech models and GPU/CPU acceleration runtimes are not bundled — install
          the ones you want from the Addon Manager in the app header.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Drift ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/linux-appimage/*.AppImage \
            dist/windows-installer/*.exe \
            dist/windows-portable/*.zip \
            dist/macos-dmg/*.dmg \
            dist/arch-package/*.pkg.tar.zst \
            dist/flatpak-bundle/*.flatpak \
            dist/android-apk-*/*.apk

      # Posts a branded embed card to CutWire Discord #releases. This lives here
      # rather than in a `release: published` workflow because releases created
      # with GITHUB_TOKEN do not trigger further workflow runs.
      - name: Notify Discord
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release.json
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is not set")

          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)

          EMBED_DESC_LIMIT = 4096
          NARDOTO_ORANGE = 0xE85A2A
          ICON = "https://raw.githubusercontent.com/LoopLess-nardoto/nardoto-editor-open/main/resources/nardoto-editor.png"

          def github_md_to_discord(text: str) -> str:
              lines = []
              for line in text.splitlines():
                  if line.startswith("### "):
                      lines.append(f"**{line[4:].strip()}**")
                  elif line.startswith("## "):
                      lines.append(f"**{line[3:].strip()}**")
                  elif line.startswith("# "):
                      lines.append(f"**{line[2:].strip()}**")
                  else:
                      lines.append(line)
              return "\n".join(lines).strip()

          def clamp(text: str, limit: int) -> str:
              if len(text) <= limit:
                  return text
              cut = text[: limit - 1]
              if "\n" in cut:
                  cut = cut.rsplit("\n", 1)[0]
              return cut.rstrip() + "…"

          def asset_label(name: str) -> str | None:
              n = name.lower()
              if "debug" in n:
                  return None
              if n.endswith(".appimage"):
                  return "Linux AppImage"
              if n.endswith(".dmg"):
                  return "macOS (Apple Silicon)"
              if "portable" in n and n.endswith(".zip"):
                  return "Windows portable"
              if "setup" in n and n.endswith(".exe"):
                  return "Windows installer"
              if n.endswith(".flatpak"):
                  return "Flatpak bundle"
              if n.endswith(".pkg.tar.zst"):
                  return "Arch Linux"
              if n.endswith(".apk"):
                  if "arm64" in n:
                      return "Android (arm64)"
                  if "armeabi" in n or "armv7" in n:
                      return "Android (armeabi-v7a)"
                  if "x86_64" in n:
                      return "Android (x86_64)"
                  return "Android"
              return name

          tag = release.get("tag_name") or ""
          title = release.get("name") or f"Nardoto Editor {tag}"
          url = release["html_url"]
          notes = github_md_to_discord(release.get("body") or "")
          description = clamp(notes or "Nova versão do Nardoto Editor.", EMBED_DESC_LIMIT)

          downloads = [
              "[Todos os arquivos](" + url + ")",
          ]
          for asset in release.get("assets") or []:
              label = asset_label(asset.get("name") or "")
              if not label:
                  continue
              downloads.append(f"[{label}]({asset['browser_download_url']})")

          payload = {
              "username": "Nardoto Editor",
              "avatar_url": ICON,
              "allowed_mentions": {"parse": []},
              "embeds": [
                  {
                      "title": title,
                      "url": url,
                      "description": description,
                      "color": NARDOTO_ORANGE,
                      "timestamp": release.get("published_at"),
                      "author": {
                          "name": "Nardoto Editor",
                          "url": "https://github.com/LoopLess-nardoto/nardoto-editor-open",
                          "icon_url": ICON,
                      },
                      "thumbnail": {"url": ICON},
                      "fields": [
                          {
                              "name": "Downloads",
                              "value": clamp("\n".join(downloads), 1024),
                          }
                      ],
                      "footer": {"text": f"GitHub · {tag}"},
                  }
              ],
          }

          req = urllib.request.Request(
              webhook.split("?")[0] + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
              "User-Agent": "Nardoto-Editor-Release-Notify",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  msg = json.load(resp)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Discord webhook failed HTTP {exc.code}: {body}") from exc

          print(f"Posted Discord message {msg.get('id')} in channel {msg.get('channel_id')}")
          PY
